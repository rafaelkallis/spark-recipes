model: deepseek-ai/DeepSeek-V4-Flash-0731
runtime: vllm
container: docker.io/eugr/spark-vllm:nightly-20260820
min_nodes: 2

metadata:
  description: DeepSeek V4 Flash (0731)
  maintainer: Rafael Kallis <rk@rafaelkallis.com>

defaults:
  port: 8000
  host: 0.0.0.0
  served_model_name: DeepSeek-V4-Flash
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  kv_cache_dtype: fp8
  block_size: 256
  max_model_len: 1048576
  max_num_seqs: 6
  max_num_batched_tokens: 8192
  # https://forums.developer.nvidia.com/t/instructions-for-running-deepseek-v4-flash-with-dspark-using-eugrs-repo/376220/45?u=rafaelkallis
  # prefix_cache_retention_interval: 4096
  num_speculative_tokens: 5
  thinking: "true"
  reasoning_effort: "high"
  scheduling_policy: "priority"

env:
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "4096"

command: |
  vllm serve {model} \
      --port {port} \
      --host {host} \
      --served-model-name {served_model_name} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --kv-cache-dtype {kv_cache_dtype} \
      --block-size {block_size} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --enable-prefix-caching \
      --prefix-cache-retention-interval {prefix_cache_retention_interval} \
      --enable-chunked-prefill \
      --enable-prompt-tokens-details \
      --tokenizer-mode deepseek_v4 \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}' \
      --speculative-config '{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"greedy"}' \
      --default-chat-template-kwargs.thinking={thinking} \
      --default-chat-template-kwargs.reasoning_effort={reasoning_effort} \
      --load-format instanttensor \
      --scheduling-policy {scheduling_policy} \
      --kv-cache-metrics \
      --cudagraph-metrics
