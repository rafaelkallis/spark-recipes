# https://github.com/gpdev-Pilcothink/DGX_Spark_vllm_Dockerfile/tree/main/0.29/GLM53-flash

recipe_version: 2
model: nvidia/GLM-5.3-Flash-NVFP4
runtime: vllm
container: pilcothink/vllm_spark_glm53:0.29
min_nodes: 2
max_nodes: 2

defaults:
  port: 8000
  host: 0.0.0.0
  served_model_name: zai-org/GLM-5.3-Flash
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  max_model_len: 1048576
  # max_model_len: 262144
  kv_cache_dtype: fp8
  kv_cache_memory_bytes: 9663676416
  max_num_seqs: 4
  max_num_batched_tokens: 4096
  max_cudagraph_capture_size: 32
  num_speculative_tokens: 7

env:
  GLM53_CONTEXT_CUDA_GRAPH: "1"
  GLM53_GROUPED_CONTEXT_STORE: "1"
  GLM53_FUSED_DFLASH_TAPS: "1"
  GLM53_CONTEXT_GRAPH_CACHE_V2: "0"

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --distributed-executor-backend mp \
    --tensor-parallel-size {tensor_parallel} \
    --dtype bfloat16 \
    --moe-backend b12x \
    --linear-backend b12x \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --no-enable-flashinfer-autotune \
    --trust-remote-code \
    --reasoning-parser glm45 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-model-len {max_model_len} \
    --kv-cache-dtype {kv_cache_dtype} \
    --block-size 256 \
    --max-cudagraph-capture-size {max_cudagraph_capture_size} \
    --max-num-seqs {max_num_seqs} \
    --speculative-config '{"method":"dflash","model":"incoai/GLM-5.3-Flash-DFlash2","num_speculative_tokens":{num_speculative_tokens},"attention_backend":"TRITON_ATTN","kv_cache_dtype":"auto","draft_sample_method":"probabilistic","rejection_sample_method":"standard","enable_adaptive_verification":false,"disable_eagle_block_drop":false}' \
    --kv-cache-memory-bytes {kv_cache_memory_bytes} \
    --served-model-name {served_model_name}
