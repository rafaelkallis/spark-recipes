# https://github.com/technigmaai/glm-5.3-flash-nvfp4-2x-dgx-sparks

recipe_version: 2
model: nvidia/GLM-5.3-Flash-NVFP4
runtime: vllm
container: ghcr.io/tonyd2wild/vllm-glm53-flash:sm121-v11-dflash2
min_nodes: 2
max_nodes: 2

defaults:
  port: 8000
  host: 0.0.0.0
  served_model_name: zai-org/GLM-5.3-Flash
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  # max_model_len: 1048576
  max_model_len: 262144
  kv_cache_dtype: fp8_e4m3
  kv_cache_memory_bytes: 8589934592
  max_num_seqs: 6
  max_num_batched_tokens: 8192
  max_cudagraph_capture_size: 24
  num_speculative_tokens: 7

env:
  GLM53_CONTEXT_CUDA_GRAPH: "1"
  GLM53_GROUPED_CONTEXT_STORE: "1"
  GLM53_FUSED_DFLASH_TAPS: "1"
  GLM53_CONTEXT_GRAPH_CACHE_V2: "0"

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --served-model-name {served_model_name} \
    --tensor-parallel-size {tensor_parallel} \
    --distributed-executor-backend mp \
    --moe-backend marlin \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --trust-remote-code \
    --reasoning-parser glm45 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-model-len {max_model_len} \
    --kv-cache-dtype {kv_cache_dtype} \
    --kv-cache-memory-bytes {kv_cache_memory_bytes} \
    --block-size 2304 \
    --max-num-seqs {max_num_seqs} \
    --speculative-config '{"method":"dflash","model":"incoai/GLM-5.3-Flash-DFlash2","num_speculative_tokens":{num_speculative_tokens}}' \
    --enforce-eager \
    --limit-mm-per-prompt '{"image":2,"video":0}'

executor_config:
  entrypoint: ""