model: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
runtime: vllm
# container: docker.io/vllm/vllm-openai:deepseekv4-flash-vision
container: docker.io/eugr/spark-vllm:nightly-20260904
min_nodes: 2

metadata:
  description: official vllm recipe, upstream vllm branch
  maintainer: Rafael Kallis <rk@rafaelkallis.com>

defaults:
  port: 8000
  host: 0.0.0.0
  served_model_name: DeepSeek-V4-Flash-Vision-Exp
  tensor_parallel: 2
  gpu_memory_utilization: 0.75
  kv_cache_dtype: fp8
  block_size: 256
  max_model_len: 1048576
  num_speculative_tokens: 3
  
  max_num_seqs: 8
  max_num_batched_tokens: 4096
  max_cudagraph_capture_size: 32

env: {}

# executor_config:
#   entrypoint: ''

command: |
  vllm serve {model} \
      --port {port} \
      --host {host} \
      --served-model-name {served_model_name} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --kv-cache-dtype {kv_cache_dtype} \
      --block-size {block_size} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --max-cudagraph-capture-size {max_cudagraph_capture_size} \
      --enable-prefix-caching \
      --enable-chunked-prefill \
      --enable-prompt-tokens-details \
      --tokenizer-mode deepseek_v4 \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}' \
      --speculative-config '{"method":"dspark","model":"deepseek-ai/DeepSeek-V4-Flash-Vision-Exp","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"probabilistic","enable_adaptive_verification":true}' \
      --default-chat-template-kwargs.thinking=true \
      --default-chat-template-kwargs.reasoning_effort=high \
      --scheduling-policy priority \
      --load-format instanttensor
