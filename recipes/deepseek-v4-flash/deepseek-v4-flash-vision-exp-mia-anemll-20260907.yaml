recipe_version: '2'

model: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
model_revision: 86f746b36186f0e567729a5c06a8c918caba82a9

runtime: vllm
container: ghcr.io/anemll/dspark-vllm-gx10:0.1.1@sha256:a83948492cf13df455170fb42885f5ef4db54fefe0feff0f841ecbff464ac9d8

min_nodes: 2
max_nodes: 2

# Applies the always-on MiaAI-Lab hotfix stack (DSML encoder, vision tower,
# nvfp4_ds_mla decode dispatch, scheduler fairness, perf backports) before
# vllm serve. See the mod README. Do NOT combine with the eugr-nightly mods in
# mods/mia-*-deepseek-v4-flash-vision-exp/ — different image lineage.
mods:
  - mia-957890ac

defaults:
  port: 8000
  host: 0.0.0.0
  served_model_name: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
  tensor_parallel: 2
  pipeline_parallel: 1
  distributed_executor_backend: mp
  # Do NOT set load_format: instanttensor. Its second pass over the draft (MTP)
  # weights wedges on dual-node TP2 (eugr/spark-vllm-docker#377); upstream never
  # uses it.
  kv_cache_dtype: nvfp4_ds_mla
  block_size: 256
  max_model_len: 1048576
  max_num_seqs: 6
  max_num_batched_tokens: 8192
  long_prefill_token_threshold: 1024
  gpu_memory_utilization: 0.835
  # ceil(max_num_seqs * (num_speculative_tokens + 1) / 8) * 8 = ceil(42/8)*8 = 48.
  # Upstream computes this in the entrypoint; a literal 42 is truncated by the
  # engine to 40 and costs ~12% at concurrency 6.
  max_cudagraph_capture_size: 48
  # Vision-Exp num_nextn_predict_layers=3 -> k must be a multiple of 3; k=6 is
  # the smallest valid k >= dspark block size 5. Do NOT drop back to 5.
  speculative_config: '{"method":"dspark","num_speculative_tokens":6,"draft_sample_method":"probabilistic"}'
  reasoning_config: '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"<think>","reasoning_end_str":"</think>"}'
  default_chat_template_kwargs: '{"thinking":true,"reasoning_effort":"low"}'
  limit_mm_per_prompt: '{"image":8}'

env:
  # Consumed by the mod to locate encoding/encoding_dsv4.py in the HF snapshot.
  # Keep DSPARK_REVISION in sync with model_revision above.
  DSPARK_MODEL: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
  DSPARK_REVISION: 86f746b36186f0e567729a5c06a8c918caba82a9

  VLLM_ALLOW_LONG_MAX_MODEL_LEN: '1'
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: '256'
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: '0'
  VLLM_USE_FLASHINFER_SAMPLER: '1'
  VLLM_USE_BREAKABLE_CUDAGRAPH: '0'
  # Mid-serve CuTeDSL/TileLang JIT can exceed the 300s sample_tokens RPC default
  # and kill EngineCore (upstream issues #65/#87).
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1800'
  VLLM_PREFIX_CACHE_RETENTION_INTERVAL: '4096'

  VLLM_USE_B12X_MOE: '1'
  VLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM: '0'
  VLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M: '16'
  B12X_W4A16_TC_DECODE: '0'

  DSPARK_MAX_INFLIGHT_PREFILLS: '1'
  DSPARK_ISSUE43_SCHED_DIAG: '0'

  # GB10 (sm_121a). Without these, b12x/CuTeDSL JITs a slower W4A16 fused MoE
  # path mid-inference instead of GB10-native kernels.
  TORCH_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_CUDA_ARCH_LIST: 12.1a
  CUTE_DSL_ARCH: sm_121a
  FLASHINFER_DISABLE_VERSION_CHECK: '1'
  TILELANG_CLEANUP_TEMP_FILES: '1'
  # sparkrun persists VLLM_CACHE_ROOT / TRITON_CACHE_DIR / FLASHINFER_* itself,
  # but not these two, whose in-image defaults live under $HOME and are lost on
  # container recreate (re-JIT on every restart).
  TILELANG_CACHE_DIR: /cache/runtime/tilelang-cache
  B12X_CUTE_COMPILE_CACHE_DIR: /cache/runtime/b12x-cute-cache
  DG_JIT_USE_NVRTC: '0'
  DG_JIT_NVCC_COMPILER: /usr/local/cuda/bin/nvcc

  # Not injected for the vllm-distributed runtime (only atlas does this), so it
  # must be set here. NCCL_CUMEM_ENABLE=0 IS sparkrun-injected — not listed.
  NCCL_NVLS_ENABLE: '0'

command: |
  vllm serve {model} \
      --revision {model_revision} \
      --served-model-name {served_model_name} \
      --host {host} \
      --port {port} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --pipeline-parallel-size {pipeline_parallel} \
      --distributed-executor-backend {distributed_executor_backend} \
      --kv-cache-dtype {kv_cache_dtype} \
      --block-size {block_size} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --long-prefill-token-threshold {long_prefill_token_threshold} \
      --max-cudagraph-capture-size {max_cudagraph_capture_size} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-prefix-caching \
      --enable-prompt-tokens-details \
      --async-scheduling \
      --enable-chunked-prefill \
      --speculative-config '{speculative_config}' \
      --tokenizer-mode deepseek_v4 \
      --limit-mm-per-prompt '{limit_mm_per_prompt}' \
      --moe-backend flashinfer_b12x \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{reasoning_config}' \
      --default-chat-template-kwargs '{default_chat_template_kwargs}' \
      --generation-config vllm \
      --enable-flashinfer-autotune

metadata:
  description: DeepSeek V4 Flash Vision-Exp on 2x DGX Spark — MiaAI-Lab DSpark hotfix stack on the Anemll 0.1.1 image, speculative decoding (k=6) and 1M context
  maintainer: rafaelkallis
  source_repository: https://github.com/MiaAI-Lab/DeepSeek-v4-Flash-DSpark-2x-DGX-Spark
  credits: MiaAI-Lab for the validated two-node DGX Spark packaging, patches and tuning; Anemll for the GB10 vLLM image

executor_config:
  entrypoint: ''
  user: root
  shm_size: 32gb
  cap_add:
    - IPC_LOCK
    - SYS_PTRACE
  ulimit:
    - memlock=-1:-1
    - stack=67108864
    - nofile=65535:65535

