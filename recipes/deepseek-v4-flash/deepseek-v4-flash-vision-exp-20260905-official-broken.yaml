recipe_version: "2"
model: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
runtime: vllm
# container: docker.io/vllm/vllm-openai:deepseekv4-flash-vision
# container: docker.io/eugr/spark-vllm:nightly-20260904
container: docker.io/eugr/spark-vllm:nightly-20260906
# container: docker.io/eugr/spark-vllm-b12x:nightly-20260906
min_nodes: 2

metadata:
  description: vanilla vllm nightly recipe
  maintainer: Rafael Kallis <rk@rafaelkallis.com>

mods:
  - "@eugr/drop-caches"
  - "@eugr/instanttensor-hybrid-draft-loader"

defaults:
  port: 8000
  host: 0.0.0.0
  served_model_name: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
  tensor_parallel: 2
  pipeline_parallel: 1
  data_parallel: 1
  gpu_memory_utilization: 0.80
  kv_cache_dtype: fp8_ds_mla
  max_model_len: 1048576
  num_speculative_tokens: 3
  
  max_num_seqs: 4
  max_num_batched_tokens: 4096
  load_format: instanttensor

# env: {}
# env:
#   CUTE_DSL_ARCH: "sm_121a"
#   SAFETENSORS_FAST_GPU: "1"
#   VLLM_ENABLE_ROCE_ALLREDUCE: "1"
#   VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2MB"
#   VLLM_WORKER_MULTIPROC_METHOD: "spawn"
#   VLLM_SSM_CONV_STATE_LAYOUT: "DS"
#   VLLM_USE_AOT_COMPILE: "1"
#   VLLM_USE_MEGA_AOT_ARTIFACT: "1"
#   VLLM_USE_V2_MODEL_RUNNER: "1"
#   VLLM_ENABLE_PCIE_ALLREDUCE: "0"
#   B12X_POLICY_MODE: "auto"
#   INSTANTTENSOR_BACKEND: "BUFFERED"
#   INSTANTTENSOR_BUFFER_SIZE: "67108864"
#   INSTANTTENSOR_CHUNK_SIZE: "8388608"
#   INSTANTTENSOR_CONCURRENCY: "1"
#   INSTANTTENSOR_IO_DEPTH: "3"

# executor_config:
#   entrypoint: ''

command: |
  vllm serve {model} \
      --port {port} \
      --host {host} \
      --served-model-name {served_model_name} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} --pipeline-parallel-size {pipeline_parallel} --data-parallel-size {data_parallel} \
      --kv-cache-dtype {kv_cache_dtype} \
      --block-size 256 \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-prefix-caching \
      --enable-chunked-prefill \
      --enable-prompt-tokens-details \
      --tokenizer-mode deepseek_v4 \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}' \
      --speculative-config '{"method":"dspark","model":"deepseek-ai/DeepSeek-V4-Flash-Vision-Exp","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"probabilistic","enable_adaptive_verification":true}' \
      --default-chat-template-kwargs.thinking=true \
      --default-chat-template-kwargs.reasoning_effort=high \
      --scheduling-policy priority \
      --load-format {load_format}
