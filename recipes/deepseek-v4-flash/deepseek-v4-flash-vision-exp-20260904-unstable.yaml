# not working
# based on
# https://spark-arena.com/api/recipes/2b9fab09-3b8a-40c0-a355-e0adbd9f43b1/raw

model: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
runtime: vllm
container: ghcr.io/anemll/dspark-vllm-gx10:0.1.1
min_nodes: 2
max_nodes: 2

metadata:
  description: DeepSeek V4 Flash Vision Exp
  maintainer: Rafael Kallis <rk@rafaelkallis.com>

defaults:
  port: 8000
  host: 0.0.0.0
  served_model_name: DeepSeek-V4-Flash-Vision-Exp
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  kv_cache_dtype: nvfp4_ds_mla
  max_model_len: 1048576
  max_num_seqs: 6
  num_speculative_tokens: 6
  max_num_batched_tokens: 8192
  max_cudagraph_capture_size: 42

env:
  TILELANG_CLEANUP_TEMP_FILES: '1'
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: '1'
  VLLM_USE_FLASHINFER_SAMPLER: '1'
  VLLM_USE_BREAKABLE_CUDAGRAPH: '0'
  VLLM_USE_B12X_MOE: '1'
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: '0'
  LONG_PREFILL_TOKEN_THRESHOLD: '1024'
  VLLM_PREFIX_CACHE_RETENTION_INTERVAL: '4096'
  DSPARK_MAX_INFLIGHT_PREFILLS: '1'
  DSPARK_ISSUE43_SCHED_DIAG: '0'
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  NCCL_CUMEM_ENABLE: '0'
  NCCL_IGNORE_CPU_AFFINITY: '1'
  NCCL_NVLS_ENABLE: '0'

executor_config:
  entrypoint: ''
  user: root
  shm_size: 32gb
  cap_add:
    - IPC_LOCK
    - SYS_PTRACE
  ulimit:
    - memlock=-1:-1
    - stack=67108864
    - nofile=65535:65535

command: |
  vllm serve {model} \
      --port {port} \
      --host {host} \
      --served-model-name {served_model_name} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --kv-cache-dtype {kv_cache_dtype} \
      --block-size 256 \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-prefix-caching \
      --enable-chunked-prefill \
      --enable-prompt-tokens-details \
      --long-prefill-token-threshold 1024 \
      --tokenizer-mode deepseek_v4 \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"<think>","reasoning_end_str":"</think>"}' \
      --moe-backend flashinfer_b12x \
      --max-cudagraph-capture-size {max_cudagraph_capture_size} \
      --speculative-config '{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"probabilistic"}' \
      --limit-mm-per-prompt '{"image":8}' \
      --default-chat-template-kwargs.thinking=true \
      --default-chat-template-kwargs.reasoning_effort=high \
      --scheduling-policy priority \
      --kv-cache-metrics \
      --cudagraph-metrics
