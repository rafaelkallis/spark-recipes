# https://github.com/gpdev-Pilcothink/DGX_Spark_vllm_Dockerfile/tree/main/0.29/DSV4F-Vision-exp

recipe_version: 2
model: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
runtime: vllm
container: docker.io/pilcothink/vllm_spark_dsv4fv:0.29
min_nodes: 2
max_nodes: 2

defaults:
  port: 8000
  host: 0.0.0.0
  served_model_name: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  max_model_len: 1048576
  kv_cache_dtype: fp8
  block_size: 256
  max_num_seqs: 10
  max_num_batched_tokens: 8192
  max_cudagraph_capture_size: 48
  num_speculative_tokens: 3

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  CUTE_DSL_ARCH: "sm_121a"
  DG_JIT_USE_NVRTC: "0"
  VLLM_USE_AOT_COMPILE: "0"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "-1"
  VLLM_MEMORY_PROFILE_INCLUDE_ATTN: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_B12X_MOE_FP4_FORCE_A16: "1"
  VLLM_SPARK_FUSED_WO: "1"
  VLLM_PLUGINS: ""

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --served-model-name {served_model_name} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --reasoning-parser deepseek_v4 \
    --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}' \
    --tool-call-parser deepseek_v4 \
    --tokenizer-mode deepseek_v4 \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-model-len {max_model_len} \
    --block-size {block_size} \
    --kv-cache-dtype {kv_cache_dtype} \
    --default-chat-template-kwargs '{"thinking":true,"reasoning_effort":"high"}' \
    --max-num-seqs {max_num_seqs} \
    --moe-backend b12x \
    --linear-backend b12x \
    --attention-backend FLASHINFER_MLA_SPARSE_DSV4 \
    --max-cudagraph-capture-size {max_cudagraph_capture_size} \
    --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}' \
    --speculative-config '{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"probabilistic","attention_backend":"FLASHINFER_MLA_SPARSE_DSV4","enable_adaptive_verification":false}'