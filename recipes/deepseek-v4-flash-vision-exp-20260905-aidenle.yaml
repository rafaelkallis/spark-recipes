# not working

# https://aidenle.com/recipes/deepseek-v4-flash-vision-4x-dgx-spark/

model: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
runtime: vllm
container: aidendle94/sparkrun-vllm-ds4-gb10:production-3.72-vision

min_nodes: 2
max_nodes: 4

metadata:
  description: aidenle recipe
  maintainer: Rafael Kallis <rk@rafaelkallis.com>

defaults:
  port: 8000
  host: 0.0.0.0
  served_model_name: DeepSeek-V4-Flash-Vision-Exp
  tensor_parallel: 2
  decode_context_parallel_size: 2
  kv_cache_dtype: fp8
  block_size: 256
  gpu_memory_utilization: 0.85
  # max_model_len: 1048576
  max_model_len: 393216
  max_num_seqs: 8
  # max_num_batched_tokens: 8192
  max_num_batched_tokens: 4096
  max_cudagraph_capture_size: 56

  num_speculative_tokens: 6
  

env: {}

executor_config:
  entrypoint: ''

command: |
  vllm serve {model} \
    --port {port} \
    --host {host} \
    --served-model-name {served_model_name} \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --decode-context-parallel-size {decode_context_parallel_size} --dcp-comm-backend ag_rs \
    --attention-backend B12X_MLA_SPARSE --moe-backend b12x --linear-backend b12x \
    --kv-cache-dtype {kv_cache_dtype} --block-size {block_size} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} --max-num-seqs {max_num_seqs} --max-num-batched-tokens {max_num_batched_tokens} \
    --max-cudagraph-capture-size {max_cudagraph_capture_size} \
    --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"],"cudagraph_capture_sizes":[7,14,21,28,35,42,49,56]}' \
    --async-scheduling --no-scheduler-reserve-full-isl --enable-chunked-prefill --enable-prefix-caching --enable-prompt-tokens-details \
    --tokenizer-mode deepseek_v4 \
    --tool-call-parser deepseek_v4 --enable-auto-tool-choice \
    --reasoning-parser deepseek_v4 \
    --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}' \
    --default-chat-template-kwargs.thinking=true \
    --default-chat-template-kwargs.reasoning_effort=high \
    --speculative-config '{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"greedy"}' \
    --load-format instanttensor \
    --disable-chunked-mm-input --limit-mm-per-prompt '{"image": 4}' \
    --scheduling-policy priority

