model: nvidia/Nemotron-3-Embed-1B-NVFP4
runtime: vllm
container: docker.io/eugr/spark-vllm:latest

metadata:
  description: NVIDIA Nemotron-3 Embed 1B NVFP4
  maintainer: Rafael Kallis <rk@rafaelkallis.com>

defaults:
  port: 8000
  host: 0.0.0.0
  served_model_name: nvidia/Nemotron-3-Embed-1B-NVFP4
  gpu_memory_utilization: 0.05
  max_model_len: 4096
  # Chunk sizes are expected to stay under 2k tokens, so 4k context is plenty.
  max_cudagraph_capture_size: 256

command: |
  vllm serve {model} \
    --port {port} \
    --host {host} \
    --served-model-name {served_model_name} \
    --trust-remote-code \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-cudagraph-capture-size {max_cudagraph_capture_size}
